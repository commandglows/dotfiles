onboarding = false

[ui]
status_indicators = "symbols"

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+q"
workspace_picker = "prefix+s"
next_workspace = "prefix+down"
previous_workspace = "prefix+up"
next_tab = "prefix+tab"
previous_tab = "prefix+shift+tab"
cycle_pane_next = ""
cycle_pane_previous = ""
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
close_pane = "prefix+x"
close_tab = "prefix+w"
close_workspace = "prefix+shift+w"
rename_pane = "prefix+r"
rename_tab = "prefix+shift+r"
rename_workspace = "prefix+alt+r"
resize_mode = ""
reload_config = ""

[[keys.command]]
key = "prefix+alt+p"
type = "popup"
description = "Project picker: opens a project as a Herdr space (crush + nvim + terminal layout)"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File \"C:\\Users\\Diane\\ShipGlows\\dotfiles\\herdr\\picker.ps1\""
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+alt+t"
type = "shell"
description = "New tab with the same layout (crush + nvim + terminal) in the current project"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File \"C:\\Users\\Diane\\ShipGlows\\dotfiles\\herdr\\new-layout-tab.ps1\""

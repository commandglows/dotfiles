[[keys.command]]
key = "prefix+alt+t"
type = "shell"
description = "New tab with the same layout (crush + nvim + terminal) in the current project"
command = "powershell -NoProfile -ExecutionPolicy Bypass -File \"C:\\Users\\Diane\\ShipGlows\\dotfiles\\herdr\\new-layout-tab.ps1\""
